---
openapi: 3.0.0
info:
  title: Contappa API
  version: 1.0.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  description: REST API for managing the Contappa service
servers:
  - url: 127.0.0.1
security: []
paths:
  "/tables":
    post:
      summary: Create new table
      operationId: createTable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTableRequest"
      responses:
        "201":
          description: Table created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Table"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      summary: Get all tables
      operationId: getAllTables
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Table"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  "/tables/{tableId}":
    parameters:
      - $ref: "#/components/parameters/tableId"
    get:
      summary: Get table by ID
      operationId: getTableById
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Table"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      summary: Update table
      operationId: updateTable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTableRequest"
      responses:
        "200":
          description: Table updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Table"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Delete table
      operationId: deleteTable
      responses:
        "204":
          description: Deleted successfully
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/tables/{tableId}/bills":
    parameters:
      - $ref: "#/components/parameters/tableId"
    post:
      summary: Create a bill
      operationId: createBill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBillRequest"
      responses:
        "201":
          description: Bill created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bill"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      summary: Get all bills
      operationId: getAllBills
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Bill"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  "/tables/{tableId}/bills/{billId}":
    parameters:
      - $ref: "#/components/parameters/tableId"
      - $ref: "#/components/parameters/billId"
    get:
      summary: Get bill by ID
      operationId: getBillById
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bill"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      summary: Update bill
      operationId: updateBill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBillRequest"
      responses:
        "200":
          description: Bill updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bill"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Delete bill
      operationId: deleteBill
      responses:
        "204":
          description: Deleted successfully
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  "/tables/{tableId}/bills/{billId}/split":
    parameters:
      - $ref: "#/components/parameters/tableId"
      - $ref: "#/components/parameters/billId"
    post:
      summary: Split a bill
      operationId: splitBill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SplitBillRequest"
      responses:
        "201":
          description: Bills created from split
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Bill"
        "400":
          description: Invalid split
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Bill not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/tables/{tableId}/bills/{billId}/pay":
    parameters:
      - $ref: "#/components/parameters/tableId"
      - $ref: "#/components/parameters/billId"
    post:
      summary: Mark a bill as paid
      operationId: payBill
      responses:
        "200":
          description: Bill marked as paid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bill"
        "404":
          description: Bill not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/reports/daily":
    get:
      summary: Sales report for one day
      operationId: getDailyReport
      parameters:
        - name: date
          in: query
          required: false
          description: Day to report on. Defaults to today in the requested zone.
          schema:
            type: string
            format: date
        - name: zone
          in: query
          required: false
          description: IANA time zone used to bound the day and bucket the hours.
          schema:
            type: string
            example: Europe/Madrid
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyReport"
        "400":
          description: Unknown time zone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/reports/products/{productId}":
    get:
      summary: Sales figures for one product
      operationId: getProductReport
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductReport"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/categories":
    post:
      summary: Create a category
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryRequest"
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      summary: List all categories
      operationId: listCategories
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  "/categories/{categoryId}":
    parameters:
      - $ref: "#/components/parameters/categoryId"
    get:
      summary: Get a category by id
      operationId: getCategoryById
      responses:
        "200":
          description: Category found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "404":
          description: Category not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      summary: Update category
      operationId: updateCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCategoryRequest"
      responses:
        "200":
          description: Category updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      summary: Delete category
      operationId: deleteCategory
      responses:
        "204":
          description: Deleted successfully
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  "/categories/{categoryId}/products":
    parameters:
      - $ref: "#/components/parameters/categoryId"
    post:
      summary: Create a product
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      summary: List products
      operationId: getAllProducts
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  "/categories/{categoryId}/products/{productId}":
    parameters:
      - $ref: "#/components/parameters/categoryId"
      - $ref: "#/components/parameters/productId"
    get:
      summary: Get product by ID
      operationId: getProductById
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      summary: Update product
      operationId: updateProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductRequest"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Delete product
      operationId: deleteProduct
      responses:
        "204":
          description: Deleted successfully
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  parameters:
    tableId:
      name: tableId
      in: path
      required: true
      schema:
        type: string
    billId:
      name: billId
      in: path
      required: true
      schema:
        type: string
    categoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: string
    productId:
      name: productId
      in: path
      required: true
      schema:
        type: string
  schemas:
    ProductReport:
      type: object
      properties:
        productId:
          type: string
        unitsSold:
          type: integer
        revenue:
          type: number
        billsSold:
          type: integer
        lastSoldAt:
          type: string
          format: date-time
          nullable: true
        unitsOpen:
          type: integer
        tablesOpen:
          type: integer
    DailyReport:
      type: object
      properties:
        date:
          type: string
          format: date
        revenue:
          type: number
        openAmount:
          type: number
        billsPaid:
          type: integer
        billsOpen:
          type: integer
        guestsServed:
          type: integer
        averageTicket:
          type: number
        hourly:
          type: array
          items:
            type: object
            properties:
              hour:
                type: integer
              revenue:
                type: number
              bills:
                type: integer
        topProducts:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              imageUrl:
                type: string
                nullable: true
              quantity:
                type: integer
              revenue:
                type: number
        categories:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              revenue:
                type: number
    Table:
      type: object
      properties:
        id:
          type: string
        number:
          type: integer
        name:
          type: string
          nullable: true
        capacity:
          type: integer
        activeBills:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/Bill"
    CreateTableRequest:
      type: object
      properties:
        number:
          type: integer
        name:
          type: string
        capacity:
          type: integer
      required:
        - number
    UpdateTableRequest:
      type: object
      properties:
        number:
          type: integer
        name:
          type: string
        capacity:
          type: integer
    Bill:
      type: object
      properties:
        id:
          type: string
        amount:
          type: number
        date:
          type: string
          format: date
        tableId:
          type: string
        paid:
          type: boolean
        guests:
          type: integer
          nullable: true
        openedAt:
          type: string
          format: date-time
          nullable: true
        lastOrderAt:
          type: string
          format: date-time
          nullable: true
        products:
          type: array
          items:
            type: object
            properties:
              productId:
                type: string
              name:
                type: string
              quantity:
                type: integer
              unitPrice:
                type: number
    CreateBillRequest:
      type: object
      properties:
        amount:
          type: number
        date:
          type: string
          format: date
        guests:
          type: integer
        tableId:
          type: string
        products:
          type: array
          items:
            type: object
            properties:
              productId:
                type: string
              quantity:
                type: integer
      required:
        - amount
        - date
        - tableId
        - products
    UpdateBillRequest:
      type: object
      properties:
        amount:
          type: number
        date:
          type: string
          format: date
        tableId:
          type: string
        paid:
          type: boolean
        guests:
          type: integer
          nullable: true
        products:
          type: array
          items:
            type: object
            properties:
              productId:
                type: string
              quantity:
                type: integer
    SplitBillRequest:
      type: object
      properties:
        splits:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              products:
                type: array
                minItems: 1
                items:
                  type: object
                  properties:
                    productId:
                      type: string
                    quantity:
                      type: integer
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
    CreateCategoryRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
      required:
        - name
    UpdateCategoryRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
    Product:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        price:
          type: number
        categoryId:
          type: string
        imageUrl:
          type: string
    CreateProductRequest:
      type: object
      properties:
        name:
          type: string
        price:
          type: number
        imageUrl:
          type: string
      required:
        - name
        - price
    UpdateProductRequest:
      type: object
      properties:
        name:
          type: string
        price:
          type: number
        imageUrl:
          type: string
    Error:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
